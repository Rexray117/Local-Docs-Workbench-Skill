<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地资料工作台</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;color:#1f2430;background:#f5f6f8}
header{padding:18px 24px;background:#12203a;color:#fff}
header h1{margin:0;font-size:18px}
header .meta{opacity:.72;font-size:12px;margin-top:4px}
#tabs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px;background:#fff;border-bottom:1px solid #e3e6ec}
#tabs button{border:1px solid #d3d8e2;background:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font:inherit}
#tabs button.on{background:#12203a;color:#fff;border-color:#12203a}
main{padding:20px 24px;max-width:1100px}
#search{width:100%;padding:8px 10px;border:1px solid #d3d8e2;border-radius:6px;margin-bottom:14px;font:inherit}
.cps{display:none}
.cps.on{display:block}
.card{background:#fff;border:1px solid #e3e6ec;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.bar{display:block;height:8px;background:#e8ebf2;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#2f6df6}
.row{display:flex;gap:10px;align-items:center;margin:6px 0}
.row .bar{flex:1}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:#eef2ff;color:#2f4bb0;white-space:nowrap}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #e3e6ec;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f7f9fc}
.empty{color:#8a93a6}
</style>
</head>
<body>
<header>
  <h1 id="doc-title">本地资料工作台</h1>
  <div class="meta"><span id="meta-source"></span> · 生成于 <span id="meta-built"></span></div>
</header>
<div id="tabs"></div>
<main>
  <input id="search" placeholder="输入关键词筛选当前页（匹配任意字段）">
  <div id="panels"></div>
</main>
<script>
const PAYLOAD = /*__PAYLOAD__*/null;

var state = { tab: null, q: "" };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}
function pct(n, d) {
  if (!d) return 0;
  return Math.max(0, Math.min(100, Math.floor((n / d) * 100)));
}
function sections() {
  return (PAYLOAD && PAYLOAD.sections) || [];
}
function match(row) {
  if (!state.q) return true;
  return JSON.stringify(row).toLowerCase().indexOf(state.q.toLowerCase()) >= 0;
}
function cell(row, col) {
  var v = row == null ? "" : row[col.key];
  if (col.href && v) {
    return '<a href="' + esc(v) + '">' + esc(col.text || v) + "</a>";
  }
  return esc(v);
}
function renderTable(sec, rows) {
  var head = "<tr>";
  sec.columns.forEach(function (c) { head += "<th>" + esc(c.label) + "</th>"; });
  head += "</tr>";
  var body = "";
  rows.forEach(function (r) {
    body += "<tr>";
    sec.columns.forEach(function (c) { body += "<td>" + cell(r, c) + "</td>"; });
    body += "</tr>";
  });
  return '<div class="card"><h3>' + esc(sec.title) + "（" + rows.length + " / " +
         sec.rows_count + '）</h3><table>' + head + body + "</table></div>";
}
function renderProgress(sec, rows) {
  var html = '<div class="card"><h3>' + esc(sec.title) + "（" + rows.length + " / " +
             sec.rows_count + "）</h3>";
  rows.forEach(function (r) {
    html += '<div class="row"><span class="pill">' + esc(r.label || r.id || "") + "</span><span>" +
            esc(r.desc || r.title || "") + '</span></div><div class="row"><span class="bar"><i style="width:' +
            pct(r.done, r.total) + '%"></i></span><span class="pill">' +
            esc(r.note || (r.done + " / " + r.total)) + "</span></div>";
  });
  return html + "</div>";
}
function renderList(sec, rows) {
  var html = '<div class="card"><h3>' + esc(sec.title) + "（" + rows.length + " / " +
             sec.rows_count + "）</h3><ul>";
  rows.forEach(function (r) {
    html += "<li>" + esc(r.label || r.text || r.title || JSON.stringify(r)) + "</li>";
  });
  return html + "</ul></div>";
}
function renderSection(sec) {
  var rows = (sec.rows || []).filter(match);
  if (sec.kind === "progress") return renderProgress(sec, rows);
  if (sec.kind === "list") return renderList(sec, rows);
  return renderTable(sec, rows);
}
function renderAll() {
  var host = document.getElementById("panels");
  var html = "";
  sections().forEach(function (sec) {
    html += '<section id="panel-' + sec.id + '" class="cps' + (state.tab === sec.id ? " on" : "") + '">' +
            renderSection(sec) + "</section>";
  });
  host.innerHTML = html || '<p class="empty">payload.sections 为空：先跑 build.py</p>';
  document.getElementById("meta-source").textContent = (PAYLOAD.meta.sources || []).join(" + ");
  document.getElementById("meta-built").textContent = PAYLOAD.meta.built_at || "";
  document.getElementById("doc-title").textContent = PAYLOAD.meta.title || "本地资料工作台";
}
function setTab(id) {
  state.tab = id;
  var tabs = document.getElementById("tabs").children || [];
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].className = tabs[i].getAttribute("data-id") === id ? "on" : "";
  }
  renderAll();
}
function init() {
  var found = sections();
  state.tab = found.length ? found[0].id : null;
  var tabs = document.getElementById("tabs");
  found.forEach(function (sec) {
    var btn = document.createElement("button");
    btn.setAttribute("data-id", sec.id);
    btn.textContent = sec.title;
    btn.onclick = function () { setTab(sec.id); };
    tabs.appendChild(btn);
  });
  document.getElementById("search").oninput = function (e) {
    state.q = e.target.value;
    renderAll();
  };
  renderAll();
}
if (typeof document !== "undefined" && document.readyState === "loading" &&
    typeof document.addEventListener === "function") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>
